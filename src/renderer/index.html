<!doctype html>
<html data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Anubee-Desktop</title>
    <style>
      @font-face { font-family:'Inter'; font-weight:400; src:url('./assets/fonts/Inter-Regular.woff2') format('woff2'); font-display:swap; }
      @font-face { font-family:'Inter'; font-weight:500; src:url('./assets/fonts/Inter-Medium.woff2') format('woff2'); font-display:swap; }
      @font-face { font-family:'Inter'; font-weight:600; src:url('./assets/fonts/Inter-SemiBold.woff2') format('woff2'); font-display:swap; }
      @font-face { font-family:'Inter'; font-weight:700; src:url('./assets/fonts/Inter-Bold.woff2') format('woff2'); font-display:swap; }
      @font-face { font-family:'JetBrains Mono'; font-weight:400; src:url('./assets/fonts/JetBrainsMono-Regular.woff2') format('woff2'); font-display:swap; }
      @font-face { font-family:'JetBrains Mono'; font-weight:500; src:url('./assets/fonts/JetBrainsMono-Medium.woff2') format('woff2'); font-display:swap; }
      @font-face { font-family:'JetBrains Mono'; font-weight:700; src:url('./assets/fonts/JetBrainsMono-Bold.woff2') format('woff2'); font-display:swap; }
      :root {
        --sp: 8px;
        --radius: 6px;
        --font: 13px/1.45 'Inter', system-ui, sans-serif;
        --mono: 'JetBrains Mono', ui-monospace, "SF Mono", Menlo, monospace;
      }
      /* Brand palette: logo gold #C9A24A, night #0F0E11, bone #F5F3EE. Chrome maps to
         these; kind + RASP colors reharmonized into a warm family, still separable. */
      :root[data-theme="dark"] {
        --surface: #0f0e11; --panel: #16151a; --panel-2: #1c1a20; --bar: #211f26;
        --border: #322e38; --border-soft: #29262f;
        --text: #e7e3d9; --muted: #97918a; --stripe: #1a181e; --hover: #23202a;
        --accent: #c9a24a; --accent-bd: #d8b05a; --accent-soft: #c9a24a26; --accent-fg: #e0be6a; --accent-ink: #17140d;
        --k-java: #8fbe7a; --k-native: #7fa0c8; --k-syscall: #e8845c; --k-func: #e0a94a;
        --warn-bg: #3a2f12; --warn-bd: #5c4a1a; --warn-fg: #e8c977;
        --input-bg: #0f0e11; --input-bd: #322e38;
        --shadow: 0 2px 10px rgba(0,0,0,.35);
        --cat-root: #e5544b; --cat-debugger: #e39a3d; --cat-emulator: #b888c8;
        --cat-integrity: #7fa0c8; --cat-hook: #4fb6a0; --cat-custom: #9a928a;
      }
      :root[data-theme="light"] {
        --surface: #f5f3ee; --panel: #fbfaf6; --panel-2: #f1eee7; --bar: #ede9e0;
        --border: #dcd6c9; --border-soft: #e8e3d8;
        --text: #201e1b; --muted: #6e675c; --stripe: #f2efe8; --hover: #f6ecea;
        --accent: #b0812e; --accent-bd: #9a6f24; --accent-soft: #f2e6cf; --accent-fg: #8a6417; --accent-ink: #17140d;
        --k-java: #4f8a3f; --k-native: #3c6e9e; --k-syscall: #c25a34; --k-func: #b07c1e;
        --warn-bg: #fff3cd; --warn-bd: #ffe08a; --warn-fg: #7a5c00;
        --input-bg: #fbfaf6; --input-bd: #dcd6c9;
        --shadow: 0 1px 4px rgba(0,0,0,.12);
        --cat-root: #c0392b; --cat-debugger: #b9770e; --cat-emulator: #8e5aa8;
        --cat-integrity: #3c6e9e; --cat-hook: #1e8f7e; --cat-custom: #6b6358;
      }

      html, body { margin: 0; height: 100%; font: var(--font); background: var(--surface); color: var(--text); }
      /* theme-matched scrollbars (Chromium/Electron) so they don't read as OS-default */
      * { scrollbar-color: var(--border) transparent; scrollbar-width: thin; }
      *::-webkit-scrollbar { width: 10px; height: 10px; }
      *::-webkit-scrollbar-track { background: transparent; }
      *::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; border: 2px solid var(--surface); }
      *::-webkit-scrollbar-thumb:hover { background: var(--muted); }
      *::-webkit-scrollbar-corner { background: transparent; }
      button, input, select { font: inherit; color: inherit; }

      .btn { background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
             padding: 4px 10px; border-radius: 5px; cursor: pointer; }
      .btn:hover { background: var(--hover); }
      .btn.pri { background: var(--accent); border-color: var(--accent-bd); color: var(--accent-ink); }

      /* rail */
      #rail { position:absolute; top:0; bottom:0; left:0; width:46px; background:var(--bar);
        border-right:1px solid var(--border); display:flex; flex-direction:column; padding:8px 0; gap:2px; z-index:10;
        overflow:hidden; transition:width .12s; }
      #rail:hover { width:172px; }
      /* mark pinned at 12px (== the 46px collapsed rail's centered inset) in both
         states, so switching width never re-aligns it - only the wordmark grows */
      #rail .brand { display:flex; align-items:center; justify-content:flex-start; padding:4px 0 10px 12px; }
      #rail .brand .brand-logo { width:22px; height:22px; flex:0 0 auto; }
      /* wordmark collapses to zero width so it never pushes the mark off the clipped rail */
      #rail .brand .wordmark { font-weight:700; letter-spacing:.16em; font-size:15px; color:var(--text);
        white-space:nowrap; max-width:0; margin-left:0; opacity:0; overflow:hidden;
        transition:opacity .12s, max-width .12s, margin-left .12s; }
      #rail:hover .brand .wordmark { max-width:120px; margin-left:9px; opacity:1; }
      .rail-item { display:flex; align-items:center; gap:11px; height:36px; padding:0 0 0 13px;
        border:0; border-left:2px solid transparent; background:transparent; color:var(--muted); cursor:pointer; }
      .rail-item:hover { color:var(--text); background:#ffffff08; }
      .rail-item.on { color:var(--accent-fg); border-left-color:var(--accent-fg); background:var(--accent-soft); }
      .rail-item .ic { width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:0 0 auto; }
      .rail-item .lbl { font-size:12px; white-space:nowrap; opacity:0; transition:opacity .12s; }
      #rail:hover .rail-item .lbl { opacity:1; }
      .rail-div { height:1px; background:var(--border); margin:7px 10px; }
      .rail-grow { flex:1; }
      /* command bar */
      #cmdbar { position:absolute; top:0; left:46px; right:0; height:44px; box-sizing:border-box;
        display:flex; align-items:center; gap:8px; padding:0 12px; background:var(--bar); border-bottom:1px solid var(--border); }
      #cmdbar .omni { flex:1; position:relative; display:flex; align-items:center; gap:8px; background:var(--input-bg);
        border:1px solid var(--input-bd); border-radius:6px; padding:0 10px; }
      #cmdbar .omni .ic { width:15px; height:15px; flex:none; fill:none; stroke:var(--muted); stroke-width:2; }
      #cmdbar .omni input { flex:1; min-width:120px; background:transparent; border:0; padding:6px 0; color:var(--text); outline:none; }
      #omni-chips { display:flex; align-items:center; gap:5px; }
      #omni-chips:empty { display:none; }
      #omni-chips .chip { display:inline-flex; align-items:center; gap:4px; white-space:nowrap;
        background:var(--hover); border:1px solid var(--input-bd); border-radius:999px; padding:1px 4px 1px 8px; font-size:11px; color:var(--text); }
      #omni-chips .chip b { color:var(--accent-fg); font-weight:600; }
      #omni-chips .chip-x { background:none; border:0; padding:0 3px; cursor:pointer; color:var(--muted); font-size:12px; line-height:1; }
      #omni-chips .chip-x:hover { color:var(--text); }
      #omni-ac { position:absolute; top:calc(100% + 4px); left:0; min-width:320px; z-index:30;
        background:var(--panel); border:1px solid var(--border); border-radius:6px; box-shadow:var(--shadow); overflow:hidden; }
      #omni-ac.hidden { display:none; }
      #omni-ac .ac-row { display:flex; gap:10px; align-items:baseline; padding:5px 10px; font-size:12px; cursor:pointer; }
      #omni-ac .ac-row b { color:var(--accent-fg); font-weight:600; min-width:64px; }
      #omni-ac .ac-row span { color:var(--muted); }
      #omni-ac .ac-row.on, #omni-ac .ac-row:hover { background:var(--hover); }

      /* --- body --- */
      #main { position: absolute; top: 44px; bottom: 0; left: 46px; right: 0; display: flex;
              --table-w: 420px; --side-w: 320px; }
      #main.no-cmdbar { top: 0; }
      .panel-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 8px;
        font-size: 9px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted);
        border-bottom: 1px solid var(--border-soft); }

      #table { width: var(--table-w); flex: 0 0 auto; display: flex; flex-direction: column;
               overflow: hidden; background: var(--panel); }
      #table .table-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; }
      /* collapsed-table width is defined once in the redesign CSS block below */
      #table.collapsed .table-scroll { display: none; }
      #table table { border-collapse: collapse; width: 100%; table-layout: fixed; }
      #table th, #table td { text-align: left; padding: 3px 6px; border-bottom: 1px solid var(--border-soft);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #table th { position: sticky; top: 0; background: var(--panel-2); }
      /* Column widths are keyed by column (columns are user-configurable), not by
         position. Narrow columns get a fixed width; the text-heavy ones
         (top java / top native / args) are left unsized to share the remainder. */
      #table .col-id { width: 40px; }
      #table .col-tid { width: 48px; }
      #table .col-syscall { width: 84px; }
      #table .col-retval { width: 56px; }
      #table .col-java { width: 44px; text-align: center; }
      #table .col-tags { width: 64px; }
      #table tr:hover td { background: var(--hover); }
      #table tr:nth-child(even) td { background: var(--stripe); }

      .resize-handle { width: 5px; flex: 0 0 auto; background: var(--border); cursor: col-resize; position: relative; }
      .resize-handle::after { content: ''; position: absolute; inset: 0 -3px; }
      .resize-handle:hover { background: var(--accent-bd); }

      #view { flex: 1 1 auto; position: relative; background: var(--surface); overflow: hidden; }
      #cy, #flame { position: absolute; inset: 0; }
      #cy.hidden { display: none; }
      #flame { display: none; overflow: auto; padding: 4px; scrollbar-gutter: stable; }
      #flame.active { display: block; }
      .flame-reset { margin: 2px 0 6px; }
      .flame-banner { padding: 4px 8px; background: var(--warn-bg); border: 1px solid var(--warn-bd);
        color: var(--warn-fg); border-radius: 4px; margin-bottom: 6px; }
      #banner { position:absolute; top:9px; right:9px; left:auto; display:none; z-index:3;
        background:var(--panel); border:1px solid var(--border-soft); color:var(--muted);
        border-radius:20px; padding:3px 10px; font-size:10px; }

      /* zoom cluster (visual box is the shared .float + .new-zoom classes; this
         rule only positions it, see redesign section) */
      #zoom { position: absolute; right: 8px; bottom: 8px; z-index: 4; }

      #legend { position: absolute; bottom: 8px; left: 8px; display: flex; gap: 10px; padding: 4px 8px;
        background: var(--bar); border: 1px solid var(--border); border-radius: 4px; font-size: 11px; z-index: 2; }
      #legend i { display: inline-block; width: 10px; height: 10px; vertical-align: middle; margin-right: 3px; }
      #legend .k-java { background: var(--k-java); transform: rotate(45deg); }
      #legend .k-native { background: var(--k-native); border-radius: 50%; }
      #legend .k-syscall { background: var(--k-syscall); border-radius: 2px; }
      #legend .k-func { background: var(--k-func); border-radius: 2px; }

      /* empty state */
      #empty-state { position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 8px; color: var(--muted); z-index: 5; }
      #empty-state.hidden { display: none; }
      #empty-state .es-logo { width: 88px; height: 88px; opacity: .9; margin-bottom: 4px; }
      #empty-state .es-title { font-size: 15px; color: var(--text); }
      #graph-empty { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
        justify-content:center; gap:10px; color:var(--muted); z-index:2; pointer-events:none; }
      #graph-empty.hidden { display:none; }
      #graph-empty .ge-ring { width:52px; height:52px; border-radius:50%; border:1.5px dashed var(--border);
        display:flex; align-items:center; justify-content:center; }
      #graph-empty .ge-ring svg { width:24px; height:24px; fill:none; stroke:var(--muted); stroke-width:1.6; }
      #graph-empty .ge-title { color:var(--text); font-size:14px; }
      #graph-empty .ge-sub { font-size:12px; }

      /* loading feedback */
      #loadbar { position:fixed; top:0; left:0; right:0; height:3px; z-index:9999;
        background:var(--panel-2); overflow:hidden; }
      #loadbar.hidden { display:none; }
      #loadbar-fill { height:100%; width:0%;
        background:linear-gradient(90deg,var(--accent),var(--accent-fg));
        transition:width .12s linear; }
      #loadbar.sweep #loadbar-fill { width:34%; border-radius:0;
        background:linear-gradient(90deg,transparent,var(--accent),var(--accent-fg),transparent);
        animation:lb-sweep 1.1s ease-in-out infinite; transition:none; }
      #loadbar.error #loadbar-fill { width:100%; background:#c0392b; animation:none; transition:width .1s linear; }
      @keyframes lb-sweep { 0%{transform:translateX(-120%)} 100%{transform:translateX(360%)} }

      #table-skeleton { padding:8px 12px; flex:1 1 auto; }
      #table-skeleton.hidden { display:none; }
      /* while the skeleton is up (load in flight) the real scroll body is empty - collapse
         it so the skeleton fills the panel instead of splitting the flex space with it. */
      #table:has(#table-skeleton:not(.hidden)) .table-scroll { display:none; }
      #table-skeleton .sk-row { display:flex; gap:12px; padding:8px 0; border-bottom:1px solid var(--stripe); }
      #table-skeleton .sk { height:10px; border-radius:3px; display:inline-block;
        background:linear-gradient(90deg,var(--panel-2) 25%,var(--hover) 50%,var(--panel-2) 75%);
        background-size:200% 100%; animation:sk-shimmer 1.3s linear infinite; }
      @keyframes sk-shimmer { to { background-position:-200% 0; } }

      #graph-overlay { position:absolute; inset:0; z-index:3; display:flex; flex-direction:column;
        align-items:center; justify-content:center; gap:12px; background:#0f0e1155; }
      #graph-overlay.hidden { display:none; }
      #graph-overlay .go-spin { width:38px; height:38px; }
      #graph-overlay .go-spin circle { fill:none; stroke:var(--accent); stroke-width:2.6;
        stroke-linecap:round; stroke-dasharray:70 40; transform-origin:center; animation:go-spin 1s linear infinite; }
      #graph-overlay .go-txt { font-size:11px; color:var(--muted); }
      @keyframes go-spin { to { transform:rotate(360deg); } }

      #toasts { position:fixed; right:14px; bottom:14px; z-index:9999; display:flex; flex-direction:column; gap:8px; }
      #toasts .toast { background:var(--panel); border:1px solid var(--border); border-radius:8px;
        padding:9px 13px; font-size:11px; color:var(--text); box-shadow:0 6px 20px #0008;
        display:flex; align-items:center; gap:9px; max-width:320px; }
      #toasts .toast.err { border-color:#c0392b66; }
      #toasts .toast .tx { background:none; border:0; color:var(--muted); cursor:pointer; font-size:13px; line-height:1; padding:0 2px; }

      /* side */
      #side { width: var(--side-w); flex: 0 0 auto; display: flex; flex-direction: column;
              overflow: hidden; background: var(--panel-2); border-left: 1px solid var(--border); }
      #side.collapsed { width: 26px; }
      #side.collapsed > *:not(.panel-head) { display: none; }
      #inspector { flex: 1 1 auto; overflow: auto; padding: 8px; font-family: var(--mono); }
      #suggestions, #orphans, #diff-table { flex: 0 0 auto; overflow: auto; padding: 8px;
        border-top: 1px solid var(--border); }
      #suggestions { max-height: 40%; }
      #orphans { max-height: 30%; display: none; background: var(--warn-bg); }
      #diff-table { max-height: 40%; }
      #diff-table table { border-collapse: collapse; width: 100%; }
      #diff-table th, #diff-table td { text-align: left; padding: 2px 6px; font-size: 12px; }

      /* capture */
      #capture { padding: 4px; display: flex; flex-direction: column; gap: 12px; overflow: auto; }
      #capture-config, #capture-form-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      #capture-config label, .cap-input { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
      #capture input[type=text], #capture select { background: var(--input-bg); border: 1px solid var(--input-bd);
        color: var(--text); border-radius: 5px; padding: 4px 7px; font: inherit; }
      #cap-form { display: flex; flex-direction: column; gap: 8px; }
      .cap-input { flex-wrap: wrap; }
      .cap-input span { min-width: 92px; }
      .cap-input input[type=text] { flex: 1 1 180px; }
      #cap-console { font-family: var(--mono); font-size: 12px; background: var(--surface); color: var(--text);
        border: 1px solid var(--border); border-radius: var(--radius); padding: 8px; height: 200px;
        overflow: auto; white-space: pre-wrap; }
      .preflight-ok { color: var(--k-java); } .preflight-bad { color: var(--k-syscall); }
      .cap-section-hd { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase;
        color: var(--muted); display: flex; align-items: center; gap: 7px; margin-top: 4px; }
      .cap-n { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px;
        border-radius: 50%; background: var(--accent, #c9a24a); color: var(--accent-ink); font-size: 10px; font-weight: 700; }
      #capture-run-row { display: flex; gap: 8px; align-items: center; }
      .path-dot { font-size: 13px; width: 12px; display: inline-block; text-align: center; }
      .cap-input-err { display: block; font-size: 11px; color: var(--k-syscall); min-height: 14px; }
      .cap-input .cap-input-err { margin-left: 92px; }
      /* the host-field error (#cfg-binary-err) is a direct child of
         #capture-config, not nested in .cap-input, so the rule above misses it;
         approximate the same 92px indent here (host labels are variable-width text,
         not a fixed-width span, so this is a close match rather than exact). */
      #capture-config > .cap-input-err { margin-left: 92px; }
      .cap-advanced { margin-top: 4px; }
      .cap-advanced > summary {
        cursor: pointer; font-size: 12px; color: var(--muted);
        list-style: none; padding: 2px 0; user-select: none;
      }
      .cap-advanced > summary::before { content: '\25B8'; display: inline-block; width: 14px; }
      .cap-advanced[open] > summary::before { content: '\25BE'; }
      .cap-advanced-body { display: flex; flex-direction: column; gap: 6px; padding: 4px 0 2px 14px; }
      .cap-advanced-body input[type=number] { flex: 0 1 90px; }

      /* offset-popup: floating table for native node offsets */
      .offset-popup { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
        padding: 8px; max-height: 300px; max-width: 400px; overflow: auto; box-shadow: var(--shadow);
        overflow-wrap: anywhere; }
      .offset-popup-head { font-family: var(--mono); font-weight: 600; padding: 0 0 6px 0; margin-bottom: 6px;
        border-bottom: 1px solid var(--border-soft); color: var(--text); word-break: break-all; font-size: 12px; }
      .offset-popup-rows { display: flex; flex-direction: column; gap: 4px; }
      .offset-row-line { display: flex; gap: 12px; align-items: center; padding: 4px; border-radius: 4px; }
      .reaches-cell { color: var(--text); flex: 1 1 auto; font-size: 12px; }
      .count-cell { font-family: var(--mono); color: var(--muted); text-align: right; flex: 0 0 40px;
        background: var(--hover); padding: 2px 6px; border-radius: 3px; }
      .offset-popup-empty { color: var(--muted); padding: 8px; font-size: 12px; text-align: center; }
      /* tag editor: category + note + save + existing tags (right-click Add Tag) */
      .tag-editor { margin-top: 8px; border-top: 1px solid var(--border); padding-top: 6px;
                    display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--text); }
      .tag-editor .tag-editor-title { font-weight: 600; overflow-wrap: anywhere; }
      .tag-editor .tag-editor-controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
      .tag-editor select, .tag-editor input, .tag-editor button {
        background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
        border-radius: 5px; padding: 3px 6px; font: inherit; }
      .tag-editor button { cursor: pointer; }
      .tag-editor button:hover { background: var(--hover); }
      .tag-editor .tag-existing { display: flex; flex-direction: column; gap: 3px; color: var(--muted); }
      /* inspector: records-behind-a-node table + detail */
      .insp-pager { padding: 4px 0 8px; }
      .insp-head { font-weight: 600; color: var(--text); margin-bottom: 6px; word-break: break-all; font-size: 12px; }
      .insp-head-title { display: flex; align-items: center; gap: 8px; }
      .insp-kdot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; background: var(--muted); }
      .insp-kdot.k-java { background: var(--k-java); }
      .insp-kdot.k-native { background: var(--k-native); }
      .insp-kdot.k-syscall { background: var(--k-syscall); }
      .insp-kdot.k-func { background: var(--k-func); }
      .insp-head-nm { font: 12px var(--mono); color: var(--text); word-break: break-all; }
      .insp-head-nm.k-java { color: var(--k-java); }
      .insp-head-nm.k-native { color: var(--k-native); }
      .insp-head-nm.k-syscall { color: var(--k-syscall); }
      .insp-head-nm.k-func { color: var(--k-func); }
      .insp-head-cats { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
      .insp-table-wrap { max-height: 40vh; overflow: auto; border: 1px solid var(--border-soft); border-radius: 6px; }
      .insp-table { width: 100%; border-collapse: collapse; font-size: 11px; }
      .insp-table th { position: sticky; top: 0; background: var(--bar); color: var(--muted); text-align: left;
        font-weight: 600; padding: 4px 6px; border-bottom: 1px solid var(--border); }
      .insp-table td { padding: 3px 6px; color: var(--text); border-bottom: 1px solid var(--border-soft);

      <g id="i-export"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v4a2 2 0 0 0 2 2h4M12 12v6M9 15l3 3 3-3"/></g>
      <g id="i-log"><path d="m4 17 6-6-6-6M12 19h8"/></g>
      <g id="i-file"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v4a2 2 0 0 0 2 2h4M9 13h6M9 17h4"/></g>
      <g id="i-package"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></g>
      <g id="i-braces"><path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5a2 2 0 0 0 2 2h1"/><path d="M16 3h1a2 2 0 0 1 2 2v5a2 2 0 0 0 2 2 2 2 0 0 0-2 2v5a2 2 0 0 1-2 2h-1"/></g>
      <g id="i-moon"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></g>
      <g id="i-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></g>
      <g id="i-search"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></g>
      <g id="i-lock"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></g>
      <g id="i-cl"><path d="m15 18-6-6 6-6"/></g>
      <g id="i-cr"><path d="m9 18 6-6-6-6"/></g>
      <g id="i-cols"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18"/></g>
      <g id="i-panel"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="m16 15-3-3 3-3"/></g>
      <g id="i-plus"><path d="M5 12h14M12 5v14"/></g>
      <g id="i-minus"><path d="M5 12h14"/></g>
      <g id="i-fit"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></g>
      <g id="i-x"><path d="M18 6 6 18M6 6l12 12"/></g>
      <g id="i-logout"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></g>
      <g id="i-lib"><path d="M4 5h4v14H4zM10 5h4v14h-4zM16 6l4 1-3 12-4-1z"/></g>
      <g id="i-chevron-down"><path d="m6 9 6 6 6-6"/></g>
    </defs></svg>

    <div id="loadbar" class="hidden"><div id="loadbar-fill"></div></div>
    <div id="toasts"></div>
    <nav id="rail">
      <span class="brand" title="Anubee"><img class="brand-logo" src="./assets/logo.svg" width="22" height="22" alt="Anubee" /><span class="wordmark">Anubee</span></span>
      <button id="tab-graph" class="rail-item on" title="Graph"><svg class="ic" viewBox="0 0 24 24"><use href="#i-graph"/></svg><span class="lbl">Graph</span></button>
      <button id="tab-flame" class="rail-item" title="Flame"><svg class="ic" viewBox="0 0 24 24"><use href="#i-flame"/></svg><span class="lbl">Flame</span></button>
      <button id="tab-libs" class="rail-item" title="Libraries"><svg class="ic" viewBox="0 0 24 24"><use href="#i-lib"/></svg><span class="lbl">Libraries</span></button>
      <span class="rail-div"></span>
      <button id="suggest-btn" class="rail-item" title="Suggestions"><svg class="ic" viewBox="0 0 24 24"><use href="#i-bulb"/></svg><span class="lbl">Suggestions</span></button>
      <button id="rules-btn" class="rail-item" title="Rules"><svg class="ic" viewBox="0 0 24 24"><use href="#i-rules"/></svg><span class="lbl">Rules</span></button>
      <button id="diff-btn" class="rail-item" title="Diff"><svg class="ic" viewBox="0 0 24 24"><use href="#i-diff"/></svg><span class="lbl">Diff</span></button>
      <button id="file-capture" class="rail-item" title="Capture"><svg class="ic" viewBox="0 0 24 24"><use href="#i-record"/></svg><span class="lbl">Capture</span></button>
      <span class="rail-div"></span>
      <button id="file-open" class="rail-item" title="Open JSONL"><svg class="ic" viewBox="0 0 24 24"><use href="#i-folder"/></svg><span class="lbl">Open</span></button>
      <button id="export-btn" class="rail-item" title="Export"><svg class="ic" viewBox="0 0 24 24"><use href="#i-export"/></svg><span class="lbl">Export</span></button>
      <button id="file-log" class="rail-item" title="Log"><svg class="ic" viewBox="0 0 24 24"><use href="#i-log"/></svg><span class="lbl">Log</span></button>
      <span class="rail-grow"></span>
      <button id="app-quit" class="rail-item" title="Quit"><svg class="ic" viewBox="0 0 24 24"><use href="#i-logout"/></svg><span class="lbl">Quit</span></button>
      <button id="theme-toggle" class="rail-item" title="Toggle light / dark"><svg class="theme-mini ic" viewBox="0 0 24 24"><use href="#i-moon"/></svg><span class="theme-pill dark"><svg class="ic" viewBox="0 0 24 24"><use href="#i-moon"/></svg><svg class="ic" viewBox="0 0 24 24"><use href="#i-sun"/></svg><span class="theme-knob"><svg class="ic" viewBox="0 0 24 24"><use href="#i-moon"/></svg></span></span><span class="lbl">Theme</span></button>
    </nav>

    <div id="cmdbar">
      <div class="omni"><svg class="ic" viewBox="0 0 24 24"><use href="#i-search"/></svg>
        <span id="omni-chips"></span>
        <input id="f-text" type="text" placeholder="search events, args, stacks…  keys: syscall: stack.lib: tid: java.exist: fn.sym: tag.name:" />
        <div id="omni-ac" class="hidden"></div>
      </div>
    </div>

    <div id="main">
      <div id="table" class="hidden">
        <div class="panel-head">
          <div class="pager">
            <button id="pager-prev" class="icon-btn" title="previous page"><svg class="ic" viewBox="0 0 24 24"><use href="#i-cl"/></svg></button>
            <span class="rng" id="pager-range">0 / 0</span>
            <button id="pager-next" class="icon-btn" title="next page"><svg class="ic" viewBox="0 0 24 24"><use href="#i-cr"/></svg></button>
          </div>
          <button id="cols-btn" class="cols-btn" title="choose columns"><svg class="ic" viewBox="0 0 24 24"><use href="#i-cols"/></svg> columns</button>
        </div>
        <div id="table-skeleton" class="hidden">
          <div class="sk-row"><span class="sk" style="width:22%"></span><span class="sk" style="width:40%"></span><span class="sk" style="width:15%"></span></div>
          <div class="sk-row"><span class="sk" style="width:30%"></span><span class="sk" style="width:28%"></span><span class="sk" style="width:20%"></span></div>
          <div class="sk-row"><span class="sk" style="width:18%"></span><span class="sk" style="width:46%"></span><span class="sk" style="width:12%"></span></div>
          <div class="sk-row"><span class="sk" style="width:26%"></span><span class="sk" style="width:34%"></span><span class="sk" style="width:22%"></span></div>
          <div class="sk-row"><span class="sk" style="width:20%"></span><span class="sk" style="width:38%"></span><span class="sk" style="width:18%"></span></div>
        </div>
        <div class="table-scroll"></div>
      </div>
      <div class="resize-handle hidden" id="table-resize" data-resize="table" title="drag to resize"></div>
      <div id="view">
        <button id="tab-left" class="hidden float new-tab" title="collapse / expand table"><svg class="ic" viewBox="0 0 24 24"><use href="#i-panel"/></svg></button>
        <div id="cy">
          <div id="banner"></div>
          <div id="legend">
            <span><i class="k-java"></i> java method</span>
            <span><i class="k-native"></i> native</span>
            <span><i class="k-syscall"></i> syscall</span>
            <span><i class="k-func"></i> func</span>
          </div>
          <div id="zoom" class="float new-zoom">
            <button id="zoom-in" class="icon-btn" title="zoom in"><svg class="ic" viewBox="0 0 24 24"><use href="#i-plus"/></svg></button>
            <button id="zoom-out" class="icon-btn" title="zoom out"><svg class="ic" viewBox="0 0 24 24"><use href="#i-minus"/></svg></button>
            <button id="zoom-fit" class="icon-btn" title="fit"><svg class="ic" viewBox="0 0 24 24"><use href="#i-fit"/></svg></button>
          </div>
        </div>
        <div id="flame"></div>
        <div id="libs" class="hidden"></div>
        <div id="empty-state">
          <img class="es-logo" src="./assets/logo.svg" width="88" height="88" alt="Anubee" />
          <div class="es-title">No run loaded</div>
          <div>Open a run to begin - use <b>Open</b> in the left rail.</div>
        </div>
        <div id="graph-empty" class="hidden">
          <div class="ge-ring"><svg viewBox="0 0 24 24"><use href="#i-graph"/></svg></div>
          <div class="ge-title">Pick a row to trace its call chain</div>
          <div class="ge-sub">select any event on the left - its java &rarr; native &rarr; syscall path draws here</div>
        </div>
        <div id="graph-overlay" class="hidden">
          <svg class="go-spin" viewBox="0 0 44 44"><circle cx="22" cy="22" r="17"/></svg>
          <div class="go-txt">Tracing call chain&hellip;</div>
        </div>
      </div>
      <div class="resize-handle hidden" id="side-resize" data-resize="side" title="drag to resize"></div>
      <div id="side" class="hidden">
        <div class="panel-head"><button id="side-close" class="icon-btn" title="close"><svg class="ic" viewBox="0 0 24 24"><use href="#i-x"/></svg></button></div>
        <div id="orphans"></div>
        <div id="inspector"></div>
        <div id="diff-table"></div>
      </div>
    </div>
    <template id="capture-template">
      <div id="capture">
        <div class="cap-section-hd"><span class="cap-n">1</span> host setup</div>
        <div id="capture-config">
          <label>anubee binary
            <input id="cfg-binary" type="text" placeholder="/host/build/anubee" />
            <button id="cfg-binary-browse" class="btn">Browse&hellip;</button>
            <span id="cfg-binary-dot" class="path-dot"></span>
          </label>
          <span id="cfg-binary-err" class="cap-input-err"></span>
          <label>save to
            <input id="cap-savepath" type="text" placeholder="(default app data)" />
            <button id="cap-browse" class="btn">Browse&hellip;</button>
          </label>
        </div>
        <div class="cap-section-hd"><span class="cap-n">2</span> engine &amp; arguments</div>
        <div id="capture-form-row">
          <select id="cap-select"></select>
          <input id="cap-timeout" type="text" size="4" placeholder="secs" title="timeout window (blank = run until Stop)" />
        </div>
        <div id="cap-form"></div>
        <div id="cap-form-err" class="cap-input-err"></div>
        <div class="cap-section-hd"><span class="cap-n">3</span> run</div>
        <div id="capture-run-row">
          <button id="cap-preflight" class="btn">Preflight</button>
          <button id="cap-start" class="btn pri" disabled>Start</button>
          <button id="cap-stop" class="btn" disabled>Stop</button>
        </div>
        <div id="cap-preflight-status"></div>
        <div id="cap-console"></div>
      </div>
    </template>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
