<!doctype html>
<html data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>ARES-Desktop</title>
    <style>
      @font-face { font-family:'Inter'; font-weight:400; src:url('./assets/fonts/Inter-Regular.woff2') format('woff2'); font-display:swap; }
      @font-face { font-family:'Inter'; font-weight:500; src:url('./assets/fonts/Inter-Medium.woff2') format('woff2'); font-display:swap; }
      @font-face { font-family:'Inter'; font-weight:600; src:url('./assets/fonts/Inter-SemiBold.woff2') format('woff2'); font-display:swap; }
      @font-face { font-family:'Inter'; font-weight:700; src:url('./assets/fonts/Inter-Bold.woff2') format('woff2'); font-display:swap; }
      @font-face { font-family:'JetBrains Mono'; font-weight:400; src:url('./assets/fonts/JetBrainsMono-Regular.woff2') format('woff2'); font-display:swap; }
      @font-face { font-family:'JetBrains Mono'; font-weight:500; src:url('./assets/fonts/JetBrainsMono-Medium.woff2') format('woff2'); font-display:swap; }
      @font-face { font-family:'JetBrains Mono'; font-weight:700; src:url('./assets/fonts/JetBrainsMono-Bold.woff2') format('woff2'); font-display:swap; }
      :root {
        --sp: 8px;
        --radius: 6px;
        --font: 13px/1.45 'Inter', system-ui, sans-serif;
        --mono: 'JetBrains Mono', ui-monospace, "SF Mono", Menlo, monospace;
      }
      :root[data-theme="dark"] {
        --surface: #0e1219; --panel: #12151c; --panel-2: #151922; --bar: #1a1f2b;
        --border: #262d3d; --border-soft: #202634;
        --text: #c9d1e0; --muted: #8b96a8; --stripe: #181d27; --hover: #1b2230;
        --accent: #2647a8; --accent-bd: #3159c9; --accent-soft: #1e3a8a33; --accent-fg: #7aa2ff;
        --k-java: #5fd28f; --k-native: #6fa8ff; --k-syscall: #ff8b7a; --k-func: #d9a441;
        --warn-bg: #3a2f12; --warn-bd: #5c4a1a; --warn-fg: #e8c977;
        --input-bg: #0e1219; --input-bd: #2a3346;
        --shadow: 0 2px 10px rgba(0,0,0,.35);
        --cat-root: #e5484d; --cat-debugger: #e08c3b; --cat-emulator: #b072e0;
        --cat-integrity: #4aa3ff; --cat-hook: #26c2a6; --cat-custom: #8b97a4;
      }
      :root[data-theme="light"] {
        --surface: #ffffff; --panel: #ffffff; --panel-2: #fafbfc; --bar: #f6f8fa;
        --border: #e2e6ea; --border-soft: #eef1f4;
        --text: #1e2530; --muted: #6b7684; --stripe: #f7f9fb; --hover: #f2f7ff;
        --accent: #1a56db; --accent-bd: #1a56db; --accent-soft: #e8f0fe; --accent-fg: #1a56db;
        --k-java: #27ae60; --k-native: #2980b9; --k-syscall: #c0392b; --k-func: #b8860b;
        --warn-bg: #fff3cd; --warn-bd: #ffe08a; --warn-fg: #7a5c00;
        --input-bg: #ffffff; --input-bd: #cbd2da;
        --shadow: 0 1px 4px rgba(0,0,0,.12);
        --cat-root: #c0392b; --cat-debugger: #b9770e; --cat-emulator: #8e44ad;
        --cat-integrity: #2980b9; --cat-hook: #0e8f7e; --cat-custom: #5c6773;
      }

      html, body { margin: 0; height: 100%; font: var(--font); background: var(--surface); color: var(--text); }
      /* theme-matched scrollbars (Chromium/Electron) so they don't read as OS-default */
      * { scrollbar-color: var(--border) transparent; scrollbar-width: thin; }
      *::-webkit-scrollbar { width: 10px; height: 10px; }
      *::-webkit-scrollbar-track { background: transparent; }
      *::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; border: 2px solid var(--surface); }
      *::-webkit-scrollbar-thumb:hover { background: var(--muted); }
      *::-webkit-scrollbar-corner { background: transparent; }
      button, input, select { font: inherit; color: inherit; }

      .btn { background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
             padding: 4px 10px; border-radius: 5px; cursor: pointer; }
      .btn:hover { background: var(--hover); }
      .btn.pri { background: var(--accent); border-color: var(--accent-bd); color: #fff; }

      /* rail */
      #rail { position:absolute; top:0; bottom:0; left:0; width:46px; background:var(--bar);
        border-right:1px solid var(--border); display:flex; flex-direction:column; padding:8px 0; gap:2px; z-index:10;
        overflow:hidden; transition:width .12s; }
      #rail:hover { width:172px; }
      #rail .brand { display:flex; justify-content:center; padding:4px 0 10px; color:var(--accent-fg); }
      #rail .brand svg { width:20px; height:20px; fill:var(--accent-fg); }
      .rail-item { display:flex; align-items:center; gap:11px; height:36px; padding:0 0 0 13px;
        border:0; border-left:2px solid transparent; background:transparent; color:var(--muted); cursor:pointer; }
      .rail-item:hover { color:var(--text); background:#ffffff08; }
      .rail-item.on { color:var(--accent-fg); border-left-color:var(--accent-fg); background:var(--accent-soft); }
      .rail-item .ic { width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:0 0 auto; }
      .rail-item .lbl { font-size:12px; white-space:nowrap; opacity:0; transition:opacity .12s; }
      #rail:hover .rail-item .lbl { opacity:1; }
      .rail-div { height:1px; background:var(--border); margin:7px 10px; }
      .rail-grow { flex:1; }
      /* command bar */
      #cmdbar { position:absolute; top:0; left:46px; right:0; height:44px; box-sizing:border-box;
        display:flex; align-items:center; gap:8px; padding:0 12px; background:var(--bar); border-bottom:1px solid var(--border); }
      #cmdbar .omni { flex:1; display:flex; align-items:center; gap:8px; background:var(--input-bg);
        border:1px solid var(--input-bd); border-radius:6px; padding:0 10px; }
      #cmdbar .omni .ic { width:15px; height:15px; fill:none; stroke:var(--muted); stroke-width:2; }
      #cmdbar .omni input { flex:1; background:transparent; border:0; padding:6px 0; color:var(--text); outline:none; }
      #cmdbar > input[type=text] { background:var(--input-bg); border:1px solid var(--input-bd); color:var(--text); padding:5px 8px; border-radius:5px; }
      #cmdbar label { font-size:12px; color:var(--muted); }

      /* --- body --- */
      #main { position: absolute; top: 44px; bottom: 0; left: 46px; right: 0; display: flex;
              --table-w: 420px; --side-w: 320px; }
      .panel-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 8px;
        font-size: 9px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted);
        border-bottom: 1px solid var(--border-soft); }

      #table { width: var(--table-w); flex: 0 0 auto; display: flex; flex-direction: column;
               overflow: hidden; background: var(--panel); }
      #table .table-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; }
      /* collapsed-table width is defined once in the redesign CSS block below */
      #table.collapsed .table-scroll { display: none; }
      #table table { border-collapse: collapse; width: 100%; table-layout: fixed; }
      #table th, #table td { text-align: left; padding: 3px 6px; border-bottom: 1px solid var(--border-soft);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #table th { position: sticky; top: 0; background: var(--panel-2); }
      /* Column widths are keyed by column (columns are user-configurable), not by
         position. Narrow columns get a fixed width; the text-heavy ones
         (top java / top native / args) are left unsized to share the remainder. */
      #table .col-id { width: 40px; }
      #table .col-tid { width: 48px; }
      #table .col-syscall { width: 84px; }
      #table .col-java { width: 44px; text-align: center; }
      #table .col-tags { width: 64px; }
      #table tr:hover td { background: var(--hover); }
      #table tr:nth-child(even) td { background: var(--stripe); }

      .resize-handle { width: 5px; flex: 0 0 auto; background: var(--border); cursor: col-resize; position: relative; }
      .resize-handle::after { content: ''; position: absolute; inset: 0 -3px; }
      .resize-handle:hover { background: var(--accent-bd); }

      #view { flex: 1 1 auto; position: relative; background: var(--surface); overflow: hidden; }
      #cy, #flame { position: absolute; inset: 0; }
      #cy.hidden { display: none; }
      #flame { display: none; overflow: auto; padding: 4px; scrollbar-gutter: stable; }
      #flame.active { display: block; }
      .flame-reset { margin: 2px 0 6px; }
      .flame-banner { padding: 4px 8px; background: var(--warn-bg); border: 1px solid var(--warn-bd);
        color: var(--warn-fg); border-radius: 4px; margin-bottom: 6px; }
      #banner { position:absolute; top:9px; right:9px; left:auto; display:none; z-index:3;
        background:var(--panel); border:1px solid var(--border-soft); color:var(--muted);
        border-radius:20px; padding:3px 10px; font-size:10px; }

      /* zoom cluster (visual box is the shared .float + .new-zoom classes; this
         rule only positions it, see redesign section) */
      #zoom { position: absolute; right: 8px; bottom: 8px; z-index: 4; }

      #legend { position: absolute; bottom: 8px; left: 8px; display: flex; gap: 10px; padding: 4px 8px;
        background: var(--bar); border: 1px solid var(--border); border-radius: 4px; font-size: 11px; z-index: 2; }
      #legend i { display: inline-block; width: 10px; height: 10px; vertical-align: middle; margin-right: 3px; }
      #legend .k-java { background: var(--k-java); transform: rotate(45deg); }
      #legend .k-native { background: var(--k-native); border-radius: 50%; }
      #legend .k-syscall { background: var(--k-syscall); border-radius: 2px; }
      #legend .k-func { background: var(--k-func); border-radius: 2px; }

      /* empty state */
      #empty-state { position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 8px; color: var(--muted); z-index: 5; }
      #empty-state.hidden { display: none; }
      #empty-state .es-title { font-size: 15px; color: var(--text); }
      #ingest-progress { margin-top: 14px; width: 240px; }
      #graph-empty { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
        justify-content:center; gap:10px; color:var(--muted); z-index:2; pointer-events:none; }
      #graph-empty.hidden { display:none; }
      #graph-empty .ge-ring { width:52px; height:52px; border-radius:50%; border:1.5px dashed var(--border);
        display:flex; align-items:center; justify-content:center; }
      #graph-empty .ge-ring svg { width:24px; height:24px; fill:none; stroke:var(--muted); stroke-width:1.6; }
      #graph-empty .ge-title { color:var(--text); font-size:14px; }
      #graph-empty .ge-sub { font-size:12px; }
      #ingest-progress.hidden { display: none; }
      #ingest-progress #ingest-bar { height: 4px; background: var(--accent, #6fa8ff); width: 0%;
        border-radius: 2px; transition: width 0.1s linear; }
      #ingest-progress #ingest-pct { font-size: 11px; color: var(--muted, #7f8ba0); }

      /* side */
      #side { width: var(--side-w); flex: 0 0 auto; display: flex; flex-direction: column;
              overflow: hidden; background: var(--panel-2); border-left: 1px solid var(--border); }
      #side.collapsed { width: 26px; }
      #side.collapsed > *:not(.panel-head) { display: none; }
      #inspector { flex: 1 1 auto; overflow: auto; padding: 8px; font-family: var(--mono); }
      #suggestions, #orphans, #diff-table { flex: 0 0 auto; overflow: auto; padding: 8px;
        border-top: 1px solid var(--border); }
      #suggestions { max-height: 40%; }
      #orphans { max-height: 30%; display: none; background: var(--warn-bg); }
      #diff-table { max-height: 40%; }
      #diff-table table { border-collapse: collapse; width: 100%; }
      #diff-table th, #diff-table td { text-align: left; padding: 2px 6px; font-size: 12px; }

      /* capture */
      #capture { padding: 4px; display: flex; flex-direction: column; gap: 12px; overflow: auto; }
      #capture-config, #capture-form-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      #capture-config label, .cap-input { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
      #capture input[type=text], #capture select { background: var(--input-bg); border: 1px solid var(--input-bd);
        color: var(--text); border-radius: 5px; padding: 4px 7px; font: inherit; }
      #cap-form { display: flex; flex-direction: column; gap: 8px; }
      .cap-input { flex-wrap: wrap; }
      .cap-input span { min-width: 92px; }
      .cap-input input[type=text] { flex: 1 1 180px; }
      #cap-console { font-family: var(--mono); font-size: 12px; background: var(--surface); color: var(--text);
        border: 1px solid var(--border); border-radius: var(--radius); padding: 8px; height: 200px;
        overflow: auto; white-space: pre-wrap; }
      .preflight-ok { color: var(--k-java); } .preflight-bad { color: var(--k-syscall); }
      .cap-section-hd { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase;
        color: var(--muted); display: flex; align-items: center; gap: 7px; margin-top: 4px; }
      .cap-n { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px;
        border-radius: 50%; background: var(--accent, #4b8bf5); color: #fff; font-size: 10px; font-weight: 700; }
      #capture-run-row { display: flex; gap: 8px; align-items: center; }
      .path-dot { font-size: 13px; width: 12px; display: inline-block; text-align: center; }
      .cap-input-err { display: block; font-size: 11px; color: var(--k-syscall); min-height: 14px; }
      .cap-input .cap-input-err { margin-left: 92px; }
      /* the host-field error (#cfg-binary-err) is a direct child of
         #capture-config, not nested in .cap-input, so the rule above misses it;
         approximate the same 92px indent here (host labels are variable-width text,
         not a fixed-width span, so this is a close match rather than exact). */
      #capture-config > .cap-input-err { margin-left: 92px; }
      .cap-advanced { margin-top: 4px; }
      .cap-advanced > summary {
        cursor: pointer; font-size: 12px; color: var(--muted);
        list-style: none; padding: 2px 0; user-select: none;
      }
      .cap-advanced > summary::before { content: '\25B8'; display: inline-block; width: 14px; }
      .cap-advanced[open] > summary::before { content: '\25BE'; }
      .cap-advanced-body { display: flex; flex-direction: column; gap: 6px; padding: 4px 0 2px 14px; }
      .cap-advanced-body input[type=number] { flex: 0 1 90px; }

      /* offset-popup: floating table for native node offsets */
      .offset-popup { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
        padding: 8px; max-height: 300px; max-width: 400px; overflow: auto; box-shadow: var(--shadow);
        overflow-wrap: anywhere; }
      .offset-popup-head { font-family: var(--mono); font-weight: 600; padding: 0 0 6px 0; margin-bottom: 6px;
        border-bottom: 1px solid var(--border-soft); color: var(--text); word-break: break-all; font-size: 12px; }
      .offset-popup-rows { display: flex; flex-direction: column; gap: 4px; }
      .offset-row { cursor: pointer; }
      .offset-row-line { display: flex; gap: 12px; align-items: center; padding: 4px; border-radius: 4px;
        cursor: pointer; }
      .offset-row-line:hover { background: var(--hover); }
      .offset-cell { font-family: var(--mono); color: var(--text); flex: 0 0 auto; }
      .reaches-cell { color: var(--text); flex: 1 1 auto; font-size: 12px; }
      .count-cell { font-family: var(--mono); color: var(--muted); text-align: right; flex: 0 0 40px;
        background: var(--hover); padding: 2px 6px; border-radius: 3px; }
      .offset-row-detail { margin: 4px 0 0 0; padding: 6px; background: var(--hover); border-radius: 4px;
        color: var(--text); font-size: 11px; border: 1px solid var(--border-soft); }
      .offset-row-menu { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
        box-shadow: var(--shadow); min-width: 120px; z-index: 60; }
      .offset-menu-item { padding: 4px 8px; cursor: pointer; font-size: 12px; color: var(--text);
        border-bottom: 1px solid var(--border-soft); }
      .offset-menu-item:last-child { border-bottom: 0; }
      .offset-menu-item:hover { background: var(--hover); }
      .offset-popup-empty { color: var(--muted); padding: 8px; font-size: 12px; text-align: center; }
      /* tag editor: category + note + save + existing tags (right-click Add Tag) */
      .tag-editor { margin-top: 8px; border-top: 1px solid var(--border); padding-top: 6px;
                    display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--text); }
      .tag-editor .tag-editor-title { font-weight: 600; overflow-wrap: anywhere; }
      .tag-editor .tag-editor-controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
      .tag-editor select, .tag-editor input, .tag-editor button {
        background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
        border-radius: 5px; padding: 3px 6px; font: inherit; }
      .tag-editor button { cursor: pointer; }
      .tag-editor button:hover { background: var(--hover); }
      .tag-editor .tag-existing { display: flex; flex-direction: column; gap: 3px; color: var(--muted); }
      /* inspector: records-behind-a-node table + detail */
      .insp-head { font-weight: 600; color: var(--text); margin-bottom: 6px; word-break: break-all; font-size: 12px; }
      .insp-head-title { display: flex; align-items: center; gap: 8px; }
      .insp-kdot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; background: var(--muted); }
      .insp-kdot.k-java { background: var(--k-java); }
      .insp-kdot.k-native { background: var(--k-native); }
      .insp-kdot.k-syscall { background: var(--k-syscall); }
      .insp-kdot.k-func { background: var(--k-func); }
      .insp-head-nm { font: 12px var(--mono); color: var(--text); word-break: break-all; }
      .insp-head-nm.k-java { color: var(--k-java); }
      .insp-head-nm.k-native { color: var(--k-native); }
      .insp-head-nm.k-syscall { color: var(--k-syscall); }
      .insp-head-nm.k-func { color: var(--k-func); }
      .insp-pill { margin-left: auto; font-size: 10px; color: var(--muted); background: var(--stripe);
        border: 1px solid var(--border-soft); border-radius: 20px; padding: 2px 8px; white-space: nowrap; }
      .insp-head-cats { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
      .insp-table-wrap { max-height: 40vh; overflow: auto; border: 1px solid var(--border-soft); border-radius: 6px; }
      .insp-table { width: 100%; border-collapse: collapse; font-size: 11px; }
      .insp-table th { position: sticky; top: 0; background: var(--bar); color: var(--muted); text-align: left;
        font-weight: 600; padding: 4px 6px; border-bottom: 1px solid var(--border); }
      .insp-table td { padding: 3px 6px; color: var(--text); border-bottom: 1px solid var(--border-soft);
        white-space: nowrap; font-family: var(--mono); }
      .insp-table td.insp-rsys { color: var(--k-syscall); }
      .insp-table td.insp-rneg { color: var(--k-syscall); }
      .insp-table td.insp-arg { white-space: normal; word-break: break-all; color: var(--muted); font-family: var(--font); max-width: 220px; }
      .insp-table tbody tr { cursor: pointer; }
      .insp-table tbody tr:hover td { background: var(--hover); }
      .insp-table tbody tr.sel td { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent-fg); }
      .insp-detail { margin-top: 8px; display: flex; flex-direction: column; gap: 9px; }
      .insp-card { border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: var(--panel-2); }
      .insp-card-h { display: flex; justify-content: space-between; align-items: center; padding: 5px 10px;
                     background: var(--stripe); font-size: 11px; font-weight: 600; color: var(--text);
                     border-left: 2px solid var(--accent-fg); }
      .insp-card-cnt { color: var(--muted); font-weight: 400; }
      .insp-kv { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 11px; }
      .insp-kv td { padding: 4px 10px; border-bottom: 1px solid var(--stripe); vertical-align: top; }
      .insp-kv td:first-child { color: var(--muted); white-space: nowrap; width: 90px; }
      .insp-kv tr:last-child td { border-bottom: 0; }
      /* backtrace/java-stack frame rows; the app's own frame (highlight) is
         called out against the bionic/ART scaffolding via .f.app / .f.sys */
      .bt { padding: 7px 10px; font-family: var(--mono); font-size: 10.5px; line-height: 1.7; }
      .bt .f { display: flex; gap: 8px; }
      .bt .idx { color: var(--muted); flex: 0 0 22px; }
      .bt .sym { color: var(--text); word-break: break-all; }
      .bt .off { color: var(--muted); }
      .bt .f.app { background: color-mix(in srgb, var(--cat-root) 12%, transparent); border-radius: 4px; margin: 0 -4px; padding: 0 4px; }
      .bt .f.app .sym { color: var(--cat-root); font-weight: 600; }
      .bt .f.sys .sym { color: var(--muted); }
      /* suggestions (opened from the rail button, into a modal body) */
      .sug-head { font-weight: 600; color: var(--text); margin-bottom: 8px; }
      .sug-empty { color: var(--muted); font-size: 12px; padding: 8px 0; }
      .sug-row { display: flex; gap: 10px; align-items: flex-start; padding: 8px 4px;
        border-bottom: 1px solid var(--border-soft); }
      .sug-info { flex: 1 1 auto; min-width: 0; }
      .sug-line1 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .cat-chip { display:inline-block; font:600 10px/1 var(--mono); letter-spacing:.04em; text-transform:uppercase;
        color:#0d1117; border-radius:4px; padding:3px 6px; vertical-align:middle; margin-right:3px; }
      .cat-chip.cat-root{background:var(--cat-root)} .cat-chip.cat-debugger{background:var(--cat-debugger)}
      .cat-chip.cat-emulator{background:var(--cat-emulator)} .cat-chip.cat-integrity{background:var(--cat-integrity)}
      .cat-chip.cat-hook{background:var(--cat-hook)} .cat-chip.cat-custom{background:var(--cat-custom)}
      .sug-target { font: 12px var(--mono); color: var(--text); word-break: break-all; }
      .sug-conf { font: 11px var(--mono); color: var(--muted); margin-left: auto; }
      .sug-rationale { font-size: 11px; color: var(--muted); margin-top: 3px; }
      .sug-btns { display: flex; flex-direction: column; gap: 4px; flex: 0 0 auto; }
      .sug-confirm { border-color: #2ea043; color: #7ee2a0; }
      .sug-reject { border-color: #c94f4f; color: #f2a3a3; }
      /* Rules modal - same card language as the suggestions list */
      .rule-row { display: flex; gap: 10px; align-items: flex-start; padding: 8px 4px; border-bottom: 1px solid var(--border-soft); }
      .rule-info { flex: 1 1 auto; min-width: 0; }
      .rule-line1 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .rule-id { font: 12px var(--mono); color: var(--text); word-break: break-all; }
      .rule-meta { font: 11px var(--mono); color: var(--muted); margin-left: auto; }
      .rule-src { font: 600 9px/1 var(--mono); text-transform: uppercase; letter-spacing: .04em;
                  color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 2px 5px; }
      .rule-pred { font: 11px var(--mono); color: var(--muted); margin-top: 3px; word-break: break-all; }
      .rule-btns { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
      .rule-sw { width:30px; height:17px; border-radius:9px; background:var(--accent); position:relative; cursor:pointer; flex:0 0 auto; border:0; }
      .rule-sw::after { content:''; position:absolute; top:2px; left:15px; width:13px; height:13px; border-radius:50%; background:#fff; transition:left .12s; }
      .rule-sw.off { background:#39435a; } .rule-sw.off::after { left:2px; }
      .rule-row.disabled { opacity:.55; }
      .rule-form { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px;
                   display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; }
      .rule-form .rf-label { color: var(--muted); font-size: 12px; }
      .rule-form input, .rule-form select { background: var(--input-bg); border: 1px solid var(--input-bd);
                   color: var(--text); border-radius: 5px; padding: 4px 7px; font: inherit; width: 100%; }
      .rule-form .rf-preview { grid-column: 1 / -1; color: var(--muted); font: 11px var(--mono); }
      .rule-form .rf-actions { grid-column: 1 / -1; display: flex; gap: 8px; justify-content: flex-end; }
      .rules-head { font-weight: 600; color: var(--text); margin-bottom: 8px; }
      .rules-status { color: var(--k-syscall); font-size: 12px; }
      /* right-click node context menu */
      .node-menu { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
        box-shadow: var(--shadow); min-width: 160px; padding: 4px; }
      .node-menu-item { padding: 6px 10px; cursor: pointer; font-size: 12px; color: var(--text); border-radius: 4px; }
      .node-menu-item:hover { background: var(--hover); }
      .tag-popup { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
                   box-shadow: 0 8px 24px rgba(0,0,0,.4); padding: 8px; min-width: 260px; max-width: 360px; }
      /* activity log modal */
      .log-term { height: 340px; overflow-y: auto; background: var(--panel, #10151f);
        border: 1px solid var(--border, #2a2f3a); border-radius: 6px; padding: 8px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 1.5; }
      .log-line { white-space: pre-wrap; word-break: break-all; color: var(--text); }
      .log-line.log-success { color: #5fd28f; }
      .log-line.log-warn { color: #d9a441; }
      .log-line.log-error { color: #ff8b7a; }
      .log-empty { color: var(--muted, #7f8ba0); font-style: italic; }
      .log-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }

      /* shared centered modal (Capture / Rules / Suggestions) */
      .modal-backdrop { position: fixed; inset: 0; z-index: 80; background: rgba(4,7,12,.62);
                        display: flex; align-items: center; justify-content: center; }
      .modal { width: 460px; max-width: 88vw; max-height: 86vh; overflow: auto;
               background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
               box-shadow: 0 18px 50px rgba(0,0,0,.55); }
      .modal-head { display: flex; align-items: center; justify-content: space-between;
                    padding: 11px 14px; border-bottom: 1px solid var(--border); }
      .modal-title { font-weight: 600; }
      .modal-body { padding: 14px; }
      .modal-menu { display: flex; flex-direction: column; gap: 6px; }
      .modal-menu-item { display: flex; align-items: center; gap: 11px; width: 100%;
        text-align: left; background: var(--panel-2); border: 1px solid var(--border);
        color: var(--text); padding: 8px 11px; border-radius: 5px; cursor: pointer; font: inherit; }
      .modal-menu-item:hover { background: var(--hover); border-color: var(--accent-bd); }
      .modal-menu-item .ic { width: 18px; height: 18px; fill: none; stroke: currentColor;
        stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; color: var(--muted); }
      .modal-menu-item:hover .ic { color: var(--accent-fg); }
      .modal-field { display: flex; align-items: center; gap: 10px; margin-top: 12px;
        padding-top: 12px; border-top: 1px solid var(--border-soft); }
      .modal-field label { font-size: 12px; color: var(--muted); min-width: 38px; }
      .modal-field select { flex: 1; background: var(--input-bg); border: 1px solid var(--input-bd);
        color: var(--text); border-radius: 5px; padding: 4px 8px; font: inherit; }

      /* --- redesign: visibility, collapse, pager, columns, selection --- */
      .hidden { display: none !important; }
      #table.collapsed { width: 0; border-right: 0; overflow: hidden; }
      /* shared flat icon-button: transparent, muted glyph, hover -> subtle fill.
         Used by pager, zoom, table-collapse, side-close and the modal close (x). */
      svg.ic { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; width: 15px; height: 15px; }
      .icon-btn { width: 28px; height: 26px; display: inline-flex; align-items: center; justify-content: center;
        border: 0; background: transparent; color: var(--muted); border-radius: 6px; cursor: pointer; }
      .icon-btn:hover { background: var(--hover); color: var(--text); }
      .icon-btn:disabled { opacity: .3; cursor: default; }
      /* shared floating-overlay surface: collapse tab + zoom cluster hover over
         the canvas and read as one family with the legend/chip surface */
      .float { background: var(--bar); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); }
      /* square collapse button, floats in the view just outside the table's right edge */
      #tab-left { position: absolute; top: 8px; left: 8px; z-index: 6; }
      #tab-left.collapsed svg { transform: scaleX(-1); }
      .new-tab { width: 28px; height: 28px; cursor: pointer; color: var(--muted);
        display: flex; align-items: center; justify-content: center; }
      .new-tab:hover { color: var(--text); background: var(--hover); }
      /* table-header pager */
      .pager { display: inline-flex; align-items: center; gap: 4px; }
      .pager .rng { font: 11px var(--mono); color: var(--muted); padding: 0 4px; }
      .cols-btn { display: inline-flex; align-items: center; gap: 6px; margin-left: auto;
        padding: 4px 9px; border: 1px solid var(--border); border-radius: 6px;
        background: transparent; color: var(--muted); font-size: 11px; cursor: pointer; }
      .cols-btn:hover { background: var(--hover); color: var(--text); }
      /* selected master-table row */
      #table tr.sel td { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent-fg); }
      /* right-panel close */
      #side-close { margin-left: auto; }
      /* zoom cluster (positioned at #zoom above; this is the button-group look) */
      .new-zoom { display: inline-flex; flex-direction: column; overflow: hidden; }
      .new-zoom button:not(:last-child) { border-bottom: 1px solid var(--border-soft); }
      /* columns picker modal rows */
      .col-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 13px; color: var(--text); }
      .col-row.fixed { color: var(--muted); }
      .cs-mode-label { font-size:9px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:2px 0 5px; }
      .seg.cs-mode { display:inline-flex; border:1px solid var(--border); border-radius:6px; overflow:hidden; margin-bottom:8px; }
      .seg.cs-mode .btn { border:0; border-radius:0; text-transform:capitalize; }
      .seg.cs-mode .btn.on { background:var(--accent); color:#fff; }
      .col-row .lock-ic { width:13px; height:13px; margin-left:auto; fill:none; stroke:var(--muted); stroke-width:2; }

      /* uniform rows + structured cells */
      #table td { height:40px; box-sizing:border-box; vertical-align:middle; }
      #table td.col-callSite { line-height:1.35; white-space:nowrap; }
      #table .cs-java, #table .cs-fn { color:var(--k-java); display:block; overflow:hidden; text-overflow:ellipsis; }
      #table .cs-fn { color:var(--k-func); }
      #table .cs-native, #table .cs-caller { color:var(--k-native); font-family:var(--mono); font-size:11px; display:block; overflow:hidden; text-overflow:ellipsis; }
      #table td.col-callSite.paired .cs-native::before { content:"↳ "; color:var(--muted); }
      #table .cs-caller::before { content:"◂ from "; color:var(--muted); font-family:var(--font); }
      #table .cs-caller.cs-top::before { content:""; }
      #table .cs-none { color:var(--muted); font-style:italic; }
      #table td.col-retval .neg { color:var(--k-syscall); }
      #table td.col-elapsed .dur { font-family:var(--mono); font-size:10px; }
      #table td.col-elapsed .bar { height:4px; margin-top:3px; border-radius:2px; background:var(--accent-fg); }
      #table td.col-elapsed .bar.hot { background:var(--k-syscall); }
      /* column resize grip */
      #table th { position:relative; }
      .col-grip { position:absolute; top:0; right:-3px; width:6px; height:100%; cursor:col-resize; }
      .col-grip:hover::after { content:''; position:absolute; right:2px; top:0; width:2px; height:100%; background:var(--accent-fg); }
      /* theme pill toggle */
      .theme-mini { width:18px; height:18px; margin-left:10px; } /* +3px pad = 13, aligns with other rail icons */
      #rail:hover #theme-toggle .theme-mini { display:none; }
      .theme-pill { display:none; width:61px; height:26px; border-radius:13px; background:var(--stripe); border:1px solid var(--border); position:relative; align-items:center; justify-content:space-between; padding:0 4px; box-sizing:border-box; }
      #rail:hover #theme-toggle .theme-pill { display:flex; }
      .theme-pill svg { width:18px; height:18px; color:var(--muted); z-index:1; }
      /* 20px knob in the 24px inner height -> 2px inset all round (vertically centered); slides between the two glyphs */
      .theme-knob { position:absolute; top:0px; width:24px; height:24px; border-radius:50%; background:var(--accent-fg); transition:left .15s; display:flex; align-items:center; justify-content:center; }
      .theme-knob svg { width:13px; height:13px; color:#0d1117; }
      .theme-pill.dark .theme-knob { left:0px; } .theme-pill.light .theme-knob { left:34px; }
      #theme-toggle { padding-left:3px; }
      #rail:hover #theme-toggle { padding-left:13px; }
    </style>
  </head>
  <body>

    <nav id="rail">
      <span class="brand"><svg viewBox="0 0 24 24"><use href="#i-diamond"/></svg></span>
      <button id="tab-graph" class="rail-item on" title="Graph"><svg class="ic" viewBox="0 0 24 24"><use href="#i-graph"/></svg><span class="lbl">Graph</span></button>
      <button id="tab-flame" class="rail-item" title="Flame"><svg class="ic" viewBox="0 0 24 24"><use href="#i-flame"/></svg><span class="lbl">Flame</span></button>
      <span class="rail-div"></span>
      <button id="suggest-btn" class="rail-item" title="Suggestions"><svg class="ic" viewBox="0 0 24 24"><use href="#i-bulb"/></svg><span class="lbl">Suggestions</span></button>
      <button id="rules-btn" class="rail-item" title="Rules"><svg class="ic" viewBox="0 0 24 24"><use href="#i-rules"/></svg><span class="lbl">Rules</span></button>
      <button id="diff-btn" class="rail-item" title="Diff"><svg class="ic" viewBox="0 0 24 24"><use href="#i-diff"/></svg><span class="lbl">Diff</span></button>
      <button id="file-capture" class="rail-item" title="Capture"><svg class="ic" viewBox="0 0 24 24"><use href="#i-record"/></svg><span class="lbl">Capture</span></button>
      <span class="rail-div"></span>
      <button id="file-open" class="rail-item" title="Open JSONL"><svg class="ic" viewBox="0 0 24 24"><use href="#i-folder"/></svg><span class="lbl">Open</span></button>
      <button id="export-btn" class="rail-item" title="Export"><svg class="ic" viewBox="0 0 24 24"><use href="#i-export"/></svg><span class="lbl">Export</span></button>
      <button id="file-log" class="rail-item" title="Log"><svg class="ic" viewBox="0 0 24 24"><use href="#i-log"/></svg><span class="lbl">Log</span></button>
      <span class="rail-grow"></span>
      <button id="app-quit" class="rail-item" title="Quit"><svg class="ic" viewBox="0 0 24 24"><use href="#i-logout"/></svg><span class="lbl">Quit</span></button>
      <button id="theme-toggle" class="rail-item" title="Toggle light / dark"><svg class="theme-mini ic" viewBox="0 0 24 24"><use href="#i-moon"/></svg><span class="theme-pill dark"><svg class="ic" viewBox="0 0 24 24"><use href="#i-moon"/></svg><svg class="ic" viewBox="0 0 24 24"><use href="#i-sun"/></svg><span class="theme-knob"><svg class="ic" viewBox="0 0 24 24"><use href="#i-moon"/></svg></span></span><span class="lbl">Theme</span></button>
    </nav>

    <div id="cmdbar">
      <div class="omni"><svg class="ic" viewBox="0 0 24 24"><use href="#i-search"/></svg>
        <input id="f-text" type="text" placeholder="filter events - syscall, library, tid, free text…" />
      </div>
      <input id="f-syscall" type="text" size="8" placeholder="syscall" />
      <input id="f-library" type="text" size="8" placeholder="library" />
      <input id="f-tid" type="text" size="5" placeholder="tid" />
      <label><input type="checkbox" id="f-hasjava" /> has java_stack</label>
      <button id="apply" class="btn pri">Apply</button>
    </div>

    <div id="main">
      <div id="table" class="hidden">
        <div class="panel-head">
          <div class="pager">
            <button id="pager-prev" class="icon-btn" title="previous page"><svg class="ic" viewBox="0 0 24 24"><use href="#i-cl"/></svg></button>
            <span class="rng" id="pager-range">0 / 0</span>
            <button id="pager-next" class="icon-btn" title="next page"><svg class="ic" viewBox="0 0 24 24"><use href="#i-cr"/></svg></button>
          </div>
          <button id="cols-btn" class="cols-btn" title="choose columns"><svg class="ic" viewBox="0 0 24 24"><use href="#i-cols"/></svg> columns</button>
        </div>
        <div class="table-scroll"></div>
      </div>
      <div class="resize-handle hidden" id="table-resize" data-resize="table" title="drag to resize"></div>
      <div id="view">
        <button id="tab-left" class="hidden float new-tab" title="collapse / expand table"><svg class="ic" viewBox="0 0 24 24"><use href="#i-panel"/></svg></button>
        <div id="cy">
          <div id="banner"></div>
          <div id="legend">
            <span><i class="k-java"></i> java method</span>
            <span><i class="k-native"></i> native</span>
            <span><i class="k-syscall"></i> syscall</span>
            <span><i class="k-func"></i> func</span>
          </div>
          <div id="zoom" class="float new-zoom">
            <button id="zoom-in" class="icon-btn" title="zoom in"><svg class="ic" viewBox="0 0 24 24"><use href="#i-plus"/></svg></button>
            <button id="zoom-out" class="icon-btn" title="zoom out"><svg class="ic" viewBox="0 0 24 24"><use href="#i-minus"/></svg></button>
            <button id="zoom-fit" class="icon-btn" title="fit"><svg class="ic" viewBox="0 0 24 24"><use href="#i-fit"/></svg></button>
          </div>
        </div>
        <div id="flame"></div>
        <div id="empty-state">
          <div class="es-title">No run loaded</div>
          <div>Open a run to begin - use <b>Open</b> in the left rail.</div>
          <div id="ingest-progress" class="hidden"><div id="ingest-bar"></div><span id="ingest-pct"></span></div>
        </div>
        <div id="graph-empty" class="hidden">
          <div class="ge-ring"><svg viewBox="0 0 24 24"><use href="#i-graph"/></svg></div>
          <div class="ge-title">Pick a row to trace its call chain</div>
          <div class="ge-sub">select any event on the left - its java &rarr; native &rarr; syscall path draws here</div>
        </div>
      </div>
      <div class="resize-handle hidden" id="side-resize" data-resize="side" title="drag to resize"></div>
      <div id="side" class="hidden">
        <div class="panel-head"><button id="side-close" class="icon-btn" title="close"><svg class="ic" viewBox="0 0 24 24"><use href="#i-x"/></svg></button></div>
        <div id="orphans"></div>
        <div id="inspector"></div>
        <div id="diff-table"></div>
      </div>
    </div>
    <template id="capture-template">
      <div id="capture">
        <div class="cap-section-hd"><span class="cap-n">1</span> host setup</div>
        <div id="capture-config">
          <label>ares binary
            <input id="cfg-binary" type="text" placeholder="/host/build/ares" />
            <button id="cfg-binary-browse" class="btn">Browse&hellip;</button>
            <span id="cfg-binary-dot" class="path-dot"></span>
          </label>
          <span id="cfg-binary-err" class="cap-input-err"></span>
          <label>save to
            <input id="cap-savepath" type="text" placeholder="(default app data)" />
            <button id="cap-browse" class="btn">Browse&hellip;</button>
