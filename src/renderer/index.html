<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ARES-Desktop</title>
    <style>
      html, body { margin: 0; height: 100%; font: 13px system-ui, sans-serif; }
      #toolbar { display: flex; gap: 8px; align-items: center; padding: 6px; border-bottom: 1px solid #ccc; }
      #toolbar input { font: inherit; padding: 2px 4px; }
      #main { position: absolute; top: 40px; bottom: 0; left: 0; right: 0; display: grid; grid-template-columns: 360px 1fr 340px; }
      #table { overflow: auto; border-right: 1px solid #ccc; }
      #table table { border-collapse: collapse; width: 100%; }
      #table th, #table td { text-align: left; padding: 2px 6px; border-bottom: 1px solid #eee; white-space: nowrap; }
      #table th { position: sticky; top: 0; background: #fafafa; }
      #cy { position: relative; }
      #banner { position: absolute; top: 6px; left: 6px; right: 6px; padding: 4px 8px; background: #fff3cd; border: 1px solid #ffe08a; display: none; }
      #inspector { overflow: auto; border-left: 1px solid #ccc; padding: 8px; font-family: ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <span id="status">No run loaded - File &#9656; Open JSONL...</span>
      <input id="f-text" placeholder="free text" />
      <input id="f-syscall" placeholder="syscall" />
      <input id="f-library" placeholder="library" />
      <input id="f-tid" placeholder="tid" size="6" />
      <label><input type="checkbox" id="f-hasjava" /> has java_stack</label>
      <button id="apply">Filter</button>
    </div>
    <div id="main">
      <div id="table"></div>
      <div id="cy"><div id="banner"></div></div>
      <div id="inspector"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
