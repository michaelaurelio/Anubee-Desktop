<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ARES-Desktop</title>
    <style>
      html, body { margin: 0; height: 100%; font: 13px system-ui, sans-serif; }
      #toolbar { display: flex; gap: 8px; align-items: center; padding: 6px; border-bottom: 1px solid #ccc; }
      #toolbar input { font: inherit; padding: 2px 4px; }
      #main { position: absolute; top: 40px; bottom: 0; left: 0; right: 0; display: grid; grid-template-columns: 360px 1fr 340px; }
      #table { overflow-y: auto; overflow-x: hidden; border-right: 1px solid #ccc; }
      #table table { border-collapse: collapse; width: 100%; table-layout: fixed; }
      #table th, #table td { text-align: left; padding: 2px 6px; border-bottom: 1px solid #eee; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #table th { position: sticky; top: 0; background: #fafafa; }
      #table td:nth-child(1), #table th:nth-child(1) { width: 34px; }
      #table td:nth-child(2), #table th:nth-child(2) { width: 40px; }
      #table td:nth-child(3), #table th:nth-child(3) { width: 64px; }
      #table td:nth-child(4), #table th:nth-child(4) { width: 48px; text-align: center; }
      #table tr:hover td { background: #f2f7ff; }
      #view { position: relative; }
      #cy, #flame { position: absolute; inset: 0; }
      #flame { display: none; overflow: auto; padding: 4px; }
      #flame.active { display: block; }
      #cy.hidden { display: none; }
      .flame-reset { margin: 2px 0 6px; font: inherit; }
      .flame-banner { padding: 4px 8px; background: #fff3cd; border: 1px solid #ffe08a; margin-bottom: 6px; }
      #banner { position: absolute; top: 6px; left: 6px; right: 6px; padding: 4px 8px; background: #fff3cd; border: 1px solid #ffe08a; display: none; }
      #legend { position: absolute; bottom: 6px; left: 6px; display: flex; gap: 10px; padding: 4px 8px;
                background: rgba(255,255,255,0.9); border: 1px solid #ddd; border-radius: 4px; font-size: 11px; z-index: 2; }
      #legend i { display: inline-block; width: 10px; height: 10px; vertical-align: middle; margin-right: 3px; }
      #legend .k-java { background: #27ae60; transform: rotate(45deg); }
      #legend .k-native { background: #2980b9; border-radius: 50%; }
      #legend .k-syscall { background: #c0392b; border-radius: 2px; }
      #side { border-left: 1px solid #ccc; display: flex; flex-direction: column; overflow: hidden; }
      #inspector { flex: 1 1 auto; overflow: auto; padding: 8px; font-family: ui-monospace, monospace; }
      #suggestions { flex: 0 0 auto; max-height: 40%; overflow: auto; border-top: 1px solid #ccc; padding: 8px; }
      #orphans { flex: 0 0 auto; max-height: 30%; overflow: auto; border-top: 1px solid #ccc; padding: 8px; display: none; background: #fff8e1; }
      #diff-table { flex: 0 0 auto; max-height: 40%; overflow: auto; border-top: 1px solid #ccc; padding: 8px; }
      #diff-table table { border-collapse: collapse; width: 100%; }
      #diff-table th, #diff-table td { text-align: left; padding: 2px 6px; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <span id="status">No run loaded - File &#9656; Open JSONL...</span>
      <input id="f-text" placeholder="free text" />
      <input id="f-syscall" placeholder="syscall" />
      <input id="f-library" placeholder="library" />
      <input id="f-tid" placeholder="tid" size="6" />
      <label><input type="checkbox" id="f-hasjava" /> has java_stack</label>
      <button id="apply">Filter</button>
      <button id="tab-graph">Graph</button>
      <button id="tab-flame">Flame</button>
      <button id="export-md">Export MD</button>
      <button id="export-json">Export JSON</button>
      <button id="load-run-b">Load run B</button>
      <select id="diff-mode">
        <option value="all">all</option>
        <option value="only-in-A">only in A</option>
        <option value="only-in-B">only in B</option>
        <option value="tagged">tagged</option>
      </select>
    </div>
    <div id="main">
      <div id="table"></div>
      <div id="view">
        <div id="cy">
          <div id="banner"></div>
          <div id="legend">
            <span><i class="k-java"></i> java method</span>
            <span><i class="k-native"></i> native</span>
            <span><i class="k-syscall"></i> syscall</span>
          </div>
        </div>
        <div id="flame"></div>
      </div>
      <div id="side">
        <div id="orphans"></div>
        <div id="inspector"></div>
        <div id="diff-table"></div>
        <div id="suggestions"></div>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
