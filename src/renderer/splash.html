<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Anubee</title>
    <style>
      @font-face { font-family:'Inter'; font-weight:600; src:url('./assets/fonts/Inter-SemiBold.woff2') format('woff2'); font-display:swap; }
      html, body { margin:0; height:100%; background:transparent; overflow:hidden; }
      .card {
        position:fixed; inset:0; display:flex; flex-direction:column;
        align-items:center; justify-content:center; gap:14px;
        background:#0f0e11; border:1px solid #322e38; border-radius:14px;
        font-family:'Inter', system-ui, sans-serif; color:#e7e3d9; user-select:none;
      }
      .card img { width:132px; height:132px; object-fit:contain; }
      .wm { font-weight:600; letter-spacing:.16em; font-size:17px; }
      .wm b { color:#c9a24a; font-weight:600; }
      .bar { position:absolute; left:0; bottom:0; height:3px; width:100%; overflow:hidden; background:#1a181e; }
      .bar::before {
        content:''; position:absolute; height:100%; width:40%;
        background:linear-gradient(90deg,#8a6a2a,#d09d51);
        animation:slide 1.1s ease-in-out infinite;
      }
      @keyframes slide { 0%{left:-40%} 100%{left:100%} }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="./assets/logo.svg" alt="Anubee" />
      <div class="wm">ANU<b>BEE</b></div>
      <div class="bar"></div>
    </div>
  </body>
</html>
